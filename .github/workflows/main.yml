name: "Main"
on:
  repository_dispatch:
  pull_request:
  push:
    branches:
      - "main"
    paths-ignore:
      - "README.md"

jobs:
  build-test:
    runs-on: ubuntu-latest
    name: Build test
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the SDK commit to build
        run: ./scripts/resolve-sdk-commit.sh
      - run: npx @dappnode/dappnodesdk build --skip_save

  release:
    name: Release
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
    steps:
      - uses: actions/checkout@v4
      # Resolves dappnode-nexus-sdk main to the commit this build actually used
      # and records it in the manifest, so the published package says which SDK
      # source went into it without anyone maintaining the value by hand.
      - name: Resolve the SDK commit to build
        run: ./scripts/resolve-sdk-commit.sh
      - name: Publish
        run: npx @dappnode/dappnodesdk publish patch --dappnode_team_preset --timeout 2h
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVELOPER_ADDRESS: "0xf35960302a07022aba880dffaec2fdd64d5bf1c1"
