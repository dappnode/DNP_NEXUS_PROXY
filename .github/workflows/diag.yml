name: "Diag"
on: [pull_request, workflow_dispatch]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Repository secret vs organisation secret
        env:
          REPO_SECRET: ${{ secrets.CI_PROBE }}
          ORG_SECRET: ${{ secrets.PINATA_API_KEY }}
          ORG_VAR: ${{ vars.TROPI_APP_ID }}
        run: |
          echo "repo-level  secrets.CI_PROBE       len=${#REPO_SECRET}"
          echo "org-level   secrets.PINATA_API_KEY len=${#ORG_SECRET}"
          echo "org-level   vars.TROPI_APP_ID      len=${#ORG_VAR}"
