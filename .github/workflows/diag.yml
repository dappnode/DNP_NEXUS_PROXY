name: "Diag"
on: [pull_request, workflow_dispatch]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Are the Tropi credentials visible here?
        env:
          APP_ID: ${{ vars.TROPI_APP_ID }}
          APP_KEY: ${{ secrets.TROPI_APP_PRIVATE_KEY }}
          OTHER_SECRET: ${{ secrets.PINATA_API_KEY }}
          OTHER_VAR: ${{ vars.DAPPNODE_SDK_VERSION_CI }}
        run: |
          echo "event=${{ github.event_name }} repo_private=${{ github.event.repository.private }}"
          echo "vars.TROPI_APP_ID            len=${#APP_ID}"
          echo "secrets.TROPI_APP_PRIVATE_KEY len=${#APP_KEY}"
          echo "secrets.PINATA_API_KEY        len=${#OTHER_SECRET}"
          echo "vars.DAPPNODE_SDK_VERSION_CI  len=${#OTHER_VAR}"
