version: "3.5"

services:
  nexus-proofs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UPSTREAM_VERSION: v0.1.0
    image: nexus-proofs.dnp.dappnode.eth:0.1.0
    container_name: DAppNodeCore-nexus-proofs.dnp.dappnode.eth
    restart: unless-stopped
    command:
      - --gateway-url
      - https://nexus-api-tee.dappnode.com
      - --trust-policy-updates
      - --trust-policy-cache
      - /var/lib/nexus-proofs/releases.json
      - --listen
      - 0.0.0.0:3301
      - --listen-scope
      - dappnode
      - --state-file
      - /var/lib/nexus-proofs/verification.json
    expose:
      - "3301"
    volumes:
      - verification_state:/var/lib/nexus-proofs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/nexus-proofs-healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  verification_state: {}
